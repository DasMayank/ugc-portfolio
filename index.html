orest-portfolio .brand-mark{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;font-size:clamp(16px,2.7vw,30px);letter-spacing:-.05em;font-weight:800;color:#F3F1E5}.forest-portfolio .brand-mark img{width:32px;height:32px;object-fit:contain;background:#F3F1E5;border-radius:8px;padding:2px}.forest-portfolio .marquee:hover .brand-track{animation-play-state:paused}.forest-portfolio .about{padding:34px 0 40px;border-top:1px solid #315445;display:grid;grid-template-columns:.65fr 1.35fr;gap:40px;align-items:start}.forest-portfolio .about p{font-size:clamp(22px,3vw,34px);letter-spacing:-.035em;line-height:1.25;margin:0;max-width:620px}.forest-portfolio .contact{background:#103A2B;padding:40px clamp(20px,4.5vw,64px) 48px;border-top:1px solid #315445}.forest-portfolio .contact-inner{max-width:1052px;margin:auto}.forest-portfolio .contact a{display:inline-block;font-size:clamp(18px,3.4vw,36px);letter-spacing:-.025em;margin-top:24px;overflow-wrap:anywhere}.forest-portfolio .hero,.forest-portfolio .work{animation:arrival .7s ease both}.forest-portfolio .work{animation-delay:.12s}@keyframes arrival{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes brand-flow{to{transform:translateX(-50%)}}

<script>
'use strict';
/* Instagram play counts supplied from the live @mayankstechfinds Reels grid,
   November 6, 2026 (ET). Preserve displayed, rounded labels; do not infer exact counts.
   Locally stored reel thumbnails link to the original reels. No temporary media CDN URLs are used. */
const VERIFIED_VIDEOS = [{"id": "Dc4JZDaNFdk", "title": "Exactly How to Get Rich by Christmas", "brand": "Higgsfield", "poster": "assets/thumb-Dc4JZDaNFdk.jpg", "platforms": {"instagram": {"views": 189000, "display": "189K", "url": "https://www.instagram.com/reel/Dc4JZDaNFdk/"}}}, {"id": "DdXQLtBtZnz", "title": "You Should Have This Much Money?", "brand": "Higgsfield", "poster": "assets/thumb-DdXQLtBtZnz.jpg", "platforms": {"instagram": {"views": 166000, "display": "166K", "url": "https://www.instagram.com/reel/DdXQLtBtZnz/"}}}, {"id": "DdXRpZGtD1T", "title": "Exactly How to Change Your Life", "brand": "Higgsfield", "poster": "assets/thumb-DdXRpZGtD1T.jpg", "platforms": {"instagram": {"views": 103000, "display": "103K", "url": "https://www.instagram.com/reel/DdXRpZGtD1T/"}}}, {"id": "Dc2SioftwHc", "title": "Please Just Listen for a Second", "brand": "Higgsfield", "poster": "assets/thumb-Dc2SioftwHc.jpg", "platforms": {"instagram": {"views": 45600, "display": "45.6K", "url": "https://www.instagram.com/reel/Dc2SioftwHc/"}}}, {"id": "DdUnrStt_7-", "title": "Mino Said People Are Broke?", "brand": "Higgsfield", "poster": "assets/thumb-DdUnrStt_7-.jpg", "platforms": {"instagram": {"views": 25500, "display": "25.5K", "url": "https://www.instagram.com/reel/DdUnrStt_7-/"}}}];
const labels={instagram:'Instagram',facebook:'Facebook',youtube:'YouTube',tiktok:'TikTok'};
const order=['instagram'];
const videos=VERIFIED_VIDEOS.filter(v=>v.brand==='Higgsfield'&&Math.max(v.platforms.instagram?.views||0,v.platforms.facebook?.views||0)>=10000).sort((a,b)=>Math.max(b.platforms.instagram?.views||0,b.platforms.facebook?.views||0)-Math.max(a.platforms.instagram?.views||0,a.platforms.facebook?.views||0)).slice(0,5);
const work=document.getElementById('work');
const stage=document.getElementById('stage');
let index=0,paused=false,hover=false,startX=null,timer=null;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
const number=n=>n.toLocaleString('en-US');
function link(url,text,className='') {const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=text;a.className=className;return a;}
function bestPlatform(v){return order.reduce((best,p)=>(v.platforms[p]?.views??-1)>(v.platforms[best]?.views??-1)?p:best,'instagram');}
function schedule(){window.clearInterval(timer);if(videos.length>1&&!paused&&!hover&&!reduced.matches&&!document.hidden)timer=window.setInterval(()=>choose(index+1),2700);}
function choose(n){if(!videos.length)return;index=(n+videos.length)%videos.length;render();schedule();}
function render(){if(!videos.length){work.hidden=true;return;}work.hidden=false;const selected=videos[index];
 const offsets=videos.length===1?[0]:videos.length===2?[-1,0]:videos.length<5?[-1,0,1]:[-2,-1,0,1,2];
 offsets.forEach(offset=>{const i=(index+offset+videos.length)%videos.length,v=videos[i];let card=stage.querySelector('[data-id="'+v.id+'"]');if(!card){card=document.createElement('div');card.dataset.id=v.id;card.className='reel';stage.append(card);}card.replaceChildren();Object.assign(card.style,{pointerEvents:Math.abs(offset)>1?'none':'auto',zIndex:String(5-Math.abs(offset)),opacity:offset===0?'1':Math.abs(offset)===1?'.68':'.32',transform:`translateX(calc(-50% + ${offset*78}%)) translateZ(${-Math.abs(offset)*80}px) rotateY(${-offset*12}deg) scale(${offset===0?1:.88})`});
 const image=document.createElement('img');image.src=v.poster;image.alt=offset===0?v.title:'';image.loading=offset===0?'eager':'lazy';
 const caption=document.createElement('span');caption.className='reel-caption';caption.setAttribute('aria-hidden','true');const title=document.createElement('strong');title.textContent=v.title;const count=document.createElement('small');count.textContent=v.platforms.instagram.display+' Instagram plays';caption.append(title,count);
 if(offset===0){const p=bestPlatform(v),a=link(v.platforms[p].url,'','side-reel');a.setAttribute('aria-label','Watch '+v.title+' on '+labels[p]);a.addEventListener('click',()=>{paused=true;document.getElementById('pause').textContent='RESUME ROTATION';schedule();});const play=document.createElement('span');play.className='play-icon';play.setAttribute('aria-hidden','true');play.textContent='▶';a.append(image,caption,play);card.append(a);}else{const button=document.createElement('button');button.type='button';button.className='side-reel';button.setAttribute('aria-label','Choose '+v.title);button.onclick=()=>choose(i);button.append(image,caption);card.append(button);}});
 document.getElementById('video-brand').textContent=selected.brand;document.getElementById('video-title').textContent=selected.title;const best=bestPlatform(selected);document.getElementById('best').textContent='Top result: '+selected.platforms[best].display+' '+labels[best]+' plays';
 const stats=document.getElementById('stats');stats.replaceChildren();order.filter(p=>selected.platforms[p]?.views!=null).forEach(p=>{const s=selected.platforms[p],box=document.createElement('div');box.className='stat';const label=document.createElement('span');label.className='eyebrow';label.textContent=labels[p];const strong=document.createElement('strong');strong.textContent=s.display;const info=document.createElement('p');info.textContent=labels[p]+' plays';box.append(label,strong,info,link(s.url,'WATCH ON '+labels[p].toUpperCase()+' ↗'));stats.append(box);});
 const dots=document.getElementById('dots');dots.replaceChildren();videos.forEach((v,i)=>{const button=document.createElement('button');button.type='button';button.className='dot'+(i===index?' active':'');button.setAttribute('aria-label',v.title);if(i===index)button.setAttribute('aria-current','true');button.onclick=()=>choose(i);dots.append(button);});document.getElementById('snapshot').textContent='Instagram Reels grid · November 6, 2026 (ET). Play counts shown as displayed; other platform metrics omitted.';}
work.addEventListener('mouseenter',()=>{hover=true;schedule();});work.addEventListener('mouseleave',()=>{hover=false;schedule();});
work.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();choose(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();choose(index-1);}});

document.getElementById('previous').onclick=()=>choose(index-1);document.getElementById('next').onclick=()=>choose(index+1);document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'RESUME ROTATION':'PAUSE ROTATION';schedule();};document.addEventListener('visibilitychange',schedule);reduced.addEventListener('change',schedule);render();schedule();
